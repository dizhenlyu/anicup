packages:
  - .
allowBuilds:
  sharp: true
  esbuild: true
  '@tailwindcss/oxide': true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@types/node@24.13.4'
  - '@types/react-dom@19.3.0'
  - '@types/react@19.3.0'
  - react-dom@19.3.0
  - react@19.3.0
  - scheduler@0.28.0
# Keep local/CI dependency layout identical and self-contained.
enableGlobalVirtualStore: false
